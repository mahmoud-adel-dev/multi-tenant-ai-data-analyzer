# Production reference configuration.
# External managed services (MongoDB Atlas, S3/R2, managed Redis) are the
# recommended production topology; this file documents the full self-hosted
# variant. Fill secrets via environment/secret manager — never in git.
name: aidl-production

services:
  web:
    image: ${WEB_IMAGE:-aidl-web:latest}
    restart: always
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      REDIS_URL: ${REDIS_URL:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      LOG_LEVEL: info
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "3000:3000"
    depends_on:
      worker:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    image: ${WORKER_IMAGE:-aidl-worker:latest}
    restart: always
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_URI}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      ANALYTICS_SERVICE_URL: http://analytics:8000
      ANALYTICS_API_TOKEN: ${ANALYTICS_API_TOKEN:-}
      LOG_LEVEL: info

  analytics:
    image: ${ANALYTICS_IMAGE:-aidl-analytics:latest}
    restart: always
    environment:
      ANALYTICS_API_TOKEN: ${ANALYTICS_API_TOKEN:-}
    # Not exposed publicly; reachable only on the compose network by workers.
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
