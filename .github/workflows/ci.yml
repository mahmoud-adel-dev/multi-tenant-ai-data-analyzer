name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Web — lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Production build with build-phase placeholders (validated again at boot).
      - run: npm run build

  python:
    name: Analytics service — lint + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: analytics-service
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        working-directory: analytics-service
        run: ruff check app tests
      - name: Tests (pytest)
        working-directory: analytics-service
        run: pytest

  integration:
    name: Integration — tenant isolation & queue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supercharge/mongodb-github-action@1.11.0
        with:
          mongodb-version: 7
      - run: npm ci
      # DB-backed suites activate automatically when MongoDB is reachable.
      - run: npx vitest run tests/tenant-isolation.test.ts

  security:
    name: Security — dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail on production vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependency audit
        working-directory: analytics-service
        run: |
          pip install -e ".[dev]" pip-audit
          pip-audit --skip-editable || true

  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: aidl-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.worker
          push: false
          tags: aidl-worker:ci
      - uses: docker/build-push-action@v6
        with:
          context: ./analytics-service
          push: false
          tags: aidl-analytics:ci
